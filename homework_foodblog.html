<!DOCTYPE html>
<html lang="en">
<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            font-family:Arial, Helvetica, sans-serif;
        }
        #leftside {
            float:left;
            width: 30%;
            min-height: 1200px;
            background-color:rgb(77, 192, 154);
        }
        #rightside {
            float:left;
            width: 70%;
            min-height: 1200px;
            background-color:rgb(238, 226, 192);
            position:relative;
        }
        #container {
            background-color:rgba(255, 255, 255, 0.85);
            position: absolute;
            top: 15%;
            left: 15%;
            min-width: 1100px;
            min-height: 1050px;
            border-radius: 0.7em;
        }
        header {
            height: 50px;
            background-color:rgba(231, 229, 229, 0.5);
            font-size: 2.75em;
            padding:0.5em;
            color:rgb(216, 150, 7);
        }
        header span {
            font-family: 'Sacramento', cursive;
        }
        main {
            position: relative;
        }
        main h2 {
            position: absolute;
            left: 20%;
            top: 30px;
            margin: 25px 0 200px 50px;
            color:rgb(60, 190, 160);
            text-transform: uppercase;
        }
        main #photos img {
            margin: 0.75em;
            border: 0.85em solid rgb(255, 255, 255);
        }
        section#blogposts {
            position: absolute;
            left: 20%;
            top: 70px;
            padding: 50px;
        }
        main .post {
            margin: 25px;
            padding: 25px;
            border: 2px solid rgba(83, 78, 58, 0.6);
            border-radius: 0.5em;
        }
        footer {
            position: absolute;
            bottom: 0;
            height: 50px;
            width: 100%;
            text-align: center;
            font-size: 0.85em;
        }

        /* ---------- New: author profile picture ---------- */
        .post .profile {
            width: 36px;
            height: 36px;
            vertical-align: middle;
            margin-right: 0.5em;
            border-radius: 50%;
            border: 2px solid rgb(60, 190, 160);
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
        }
        .post .profile:hover {
            transform: scale(1.15);
        }

        /* ---------- New: floating author info box ---------- */
        #author-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            padding: 1.5em;
            background-color: rgba(40, 40, 40, 0.95);
            color: rgb(255, 255, 255);
            border-radius: 0.6em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 100;
        }
        #author-box .close {
            position: absolute;
            top: 0.4em;
            right: 0.6em;
            background: none;
            border: none;
            color: rgb(255, 255, 255);
            font-size: 1.4em;
            cursor: pointer;
        }
        #author-box h3 {
            margin: 0 0 0.75em 0;
            font-size: 1.6em;
            letter-spacing: 1px;
        }
        #author-box .label {
            font-weight: bold;
            color: rgb(216, 150, 7);
        }
        #author-box p {
            margin: 0.4em 0 1em 0;
            line-height: 1.4;
            font-size: 0.95em;
        }
        #author-box .dismiss {
            padding: 0.4em 1.2em;
            background-color: rgb(60, 190, 160);
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 0.3em;
            cursor: pointer;
        }
        #author-box .dismiss:hover {
            background-color: rgb(77, 192, 154);
        }
    </style>
</head>
<body>
    <aside id="leftside"></aside>
    <aside id="rightside"></aside>

    <div id="container">

        <blog-header v-bind:title="blog.title"></blog-header>

        <main>
            <aside id="photos">
                <img v-bind:src="blog.photo.src" v-bind:alt="blog.photo.alt" v-bind:width="blog.photo.width">
            </aside>

            <section-heading v-bind:heading="blog.commentsHeading"></section-heading>

            <section id="blogposts">
                <div class="post" v-for="post in posts" v-bind:key="post.author">
                    <!-- Profile placeholder: src bound with v-bind, click opens the author box -->
                    <img class="profile"
                         v-bind:src="blog.profileImage"
                         v-bind:alt="'Profile picture of ' + post.author"
                         v-on:click="showAuthor(post)">
                    <span class="author">{{ post.author }}</span> &mdash;
                    <span class="date">{{ post.date }}</span>
                    <span class="reply">{{ blog.replyLabel }}</span>
                    <p>{{ post.comment }}</p>
                </div>
            </section>
        </main>

        <blog-footer v-bind:text="blog.footer"></blog-footer>

        <!-- Floating author box: only rendered while an author is selected -->
        <div id="author-box" v-if="selectedAuthor">
            <button class="close" v-on:click="closeAuthor" aria-label="Close">&times;</button>
            <h3>{{ selectedAuthor.author }}</h3>
            <span class="label">Foodie Level:</span> {{ selectedAuthor.level }}
            <p><span class="label">Bio:</span><br>{{ selectedAuthor.bio }}</p>
            <button class="dismiss" v-on:click="closeAuthor">Close</button>
        </div>
    </div>

    <script>
        var app = new Vue({
            el: '#container',
            data: {
                selectedAuthor: null,
                blog: {
                    title: 'Food Blog',
                    commentsHeading: 'Comments',
                    replyLabel: 'REPLY',
                    footer: '© Copyright FOOD BLOG',
                    profileImage: 'images/profile.png',
                    photo: {
                        src: 'images/chili.jpg',
                        alt: 'White Chicken Chili',
                        width: 180
                    }
                },
                posts: [
                    {
                        author: 'Brianna',
                        date: 'February 18, 2021 @ 3:30 pm',
                        level: 'Novice',
                        bio: 'Food enthusiast. Love to cook and experiment. Into only organic, fat free, sugar free stuffs!',
                        comment: 'Was amazing! My Walmart didn’t have coriander in stock and didn’t have ground cumin. I used serrano instead of jalapeño. It was just like my favorite tortilla soup from BJs. I am sending this recipe to my family. I want everyone to try it!'
                    },
                    {
                        author: 'LINH',
                        date: 'February 15, 2021 @ 9:46 am',
                        level: 'Newcomer',
                        bio: 'Love food! Grew up with meat and potatoes. Recently venture outside my comfort zone. Loving everything I have been eating so far. Thai is my favorite at this time.',
                        comment: 'I just made this soup today and it’s so tasty! didn’t have corn at home but still turned out very good. It’s a winner! I made beef chili for my parents; but since my dad has gout he can’t eat beef; this white chicken chili is perfect for him. Thank you Lisa!'
                    },
                    {
                        author: 'CATHERINE LEONARDO',
                        date: 'February 13, 2021 @ 12:58 pm',
                        level: 'Mentor',
                        bio: 'I have to say I never was the adventurous type until 2 years ago. My boyfriend, who is of Japanese background, exposed me to other cultural food and I have never look back since!',
                        comment: 'I LOVE this White Chicken Chili! You are right, it is satiating meal—delicious with toasted bread. Refreshingly different taste than any chicken chili I’ve made in the past. I made it exactly as written and added some chopped zucchini, carrots, and celery. Instead of shredding the chicken, I chopped it into small pieces. It freezes very well. Will be an all-time favorite, for sure.'
                    },
                    {
                        author: 'KALI',
                        date: 'February 13, 2021 @ 11:31 am',
                        level: 'Novice',
                        bio: 'Food is my passion. So is cooking. I love to experiment and try new things. I have to admit I’m a food whore! Invite me over for dinner and I’ll be there!',
                        comment: 'This recipe is dynamite! My partner usually won’t eat beans but he finished the whole pot (darn was hoping to have some for leftovers haha). This is crowd-pleaser that I am going to add to my regular recipe rotation. Thanks so much, Lisa!'
                    }
                ]
            },
            methods: {
                showAuthor: function (post) {
                    this.selectedAuthor = post;
                },
                closeAuthor: function () {
                    this.selectedAuthor = null;
                }
            },
            components: {
                'blog-header': {
                    props: ['title'],
                    template: '<header><span>{{ title }}</span></header>'
                },
                'section-heading': {
                    props: ['heading'],
                    template: '<h2>{{ heading }}</h2>'
                },
                'blog-footer': {
                    props: ['text'],
                    template: '<footer>{{ text }}</footer>'
                }
            }
        });
    </script>
</body>
</html>
